# 养乐多在吃什么 — AI 配置模板
#
# 用法：复制这个文件为 config.ini，填入自己的 key，
# 然后打开站点 →「设置」→「导入 config.ini」。
#
# 注意：站点是纯静态的，浏览器读不到你磁盘上的文件，
# 所以是「手动导入」一次，内容会存进浏览器本地。
# config.ini 本身不要提交到仓库（.gitignore 已排除）。

[ai]
enabled = true
base_url = https://api.deepseek.com/v1
model = deepseek-v4.1-flash
api_key = sk-填你自己的
temperature = 0.3
timeout_ms = 30000

[prompts]
# 提示词可以整段删掉，删掉就用内置默认值。
# 换行用 \n 表示。
estimate = 你是营养师。估算这道菜「{dish}」每份的营养，只输出 JSON：{"kcal":数字,"p":数字,"f":数字,"c":数字,"comment":"20字以内点评"}
advice = 你是营养师。今天吃了：\n{dishes}\n合计 {kcal} kcal（蛋白 {p}g、脂肪 {f}g、碳水 {c}g），目标 {target} kcal。只输出 JSON：{"score":0到100,"comment":"一句话","tips":["建议1","建议2"]}
suggest = 我有这些食材：{ingredients}。推荐 3 道能做的家常菜，只输出 JSON 数组：[{"name":"菜名","kcal":数字,"reason":"一句话"}]
